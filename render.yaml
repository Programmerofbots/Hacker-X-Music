services:
  - type: web
    name: hacker-x-music
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    envVars:
      - key: PORT
        value: 10000
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ARC_API_KEY
        sync: false
      - key: COOKIES_DIR
        value: .
